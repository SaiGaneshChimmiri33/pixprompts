<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin | PixPrompts</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F0EA;--card:#FBF9F6;--ink:#0A0A0A;--mute:#5E5953;--line:rgba(10,10,10,.14);--orange:#E8480A;--orange-text:#C23B00;--chip:#ECE7E0;--ok:#0B6B3A;--font:"Inter Tight","Inter",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:860px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}.top img{border-radius:11px}
h1{font-size:1.7rem;letter-spacing:-.04em;margin:0;font-weight:700}h2{font-size:1.15rem;letter-spacing:-.02em;margin:0 0 10px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 5px}
input,textarea,select{font:inherit;width:100%;padding:12px 15px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}input[type=color]{padding:3px;height:44px}textarea{min-height:130px}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.r>*{flex:1 1 140px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;background:var(--chip);color:var(--ink)}
button:hover{background:#e0dad1}
.p{background:var(--orange);color:#fff}.p:hover{background:#C93D00}.d{color:var(--orange-text)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0;flex-wrap:wrap}.it:first-child{border:0}
.it small{color:var(--mute)}.it b{display:block}.tg{font-size:.75rem;background:var(--chip);border-radius:99px;padding:2px 10px;margin-left:8px;font-weight:500}
#msg{font-weight:600;min-height:1.5em;margin:8px 0}
.chk{display:flex;gap:16px;flex-wrap:wrap}.chk label{display:flex;gap:7px;align-items:center;font-weight:500;margin:0}
img.pv{max-width:140px;border-radius:12px;display:block;margin-top:8px}.hide{display:none}
.tabs{display:flex;gap:8px;margin:14px 0 0}.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.msgitem{border-top:1px solid var(--line);padding:14px 0}.msgitem:first-child{border:0}.msgitem p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}.msgitem small{color:var(--mute)}
a{color:var(--orange-text);font-weight:600}
</style></head><body><div class="w">
<div class="top"><img src="/logo.svg" width="38" height="38" alt=""><h1>PixPrompts admin</h1></div>
<p id="msg" role="status"></p>

<section class="card" id="login"><h2>Sign in</h2>
<label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password">
<p><button class="p" id="go">Sign in</button></p></section>

<div id="app" class="hide">
<div class="tabs" role="group" aria-label="Sections"><button id="tp" aria-pressed="true">Prompts</button><button id="ti" aria-pressed="false">Inbox</button></div>

<div id="pane-p">
<section class="card"><h2 id="fh">Add a prompt</h2>
<label for="t">Title</label><input id="t" maxlength="80">
<label for="c">Category</label><input id="c" list="cl" maxlength="30"><datalist id="cl"></datalist>
<label>Works with</label>
<div class="chk" id="tools"><label><input type="checkbox" value="ChatGPT">ChatGPT</label><label><input type="checkbox" value="Gemini">Gemini</label><label><input type="checkbox" value="Midjourney">Midjourney</label><label><input type="checkbox" value="Meta AI">Meta AI</label></div>
<label for="x">Prompt text</label><textarea id="x" maxlength="1500" placeholder="Do not add the 'keep my face accurate' line. The site adds it when copying."></textarea>
<div class="r"><div><label for="c1">Card colour 1</label><input id="c1" type="color" value="#FFB6C9"></div><div><label for="c2">Card colour 2</label><input id="c2" type="color" value="#8EC5FF"></div></div>
<label for="im">Preview image (optional, auto-resized)</label><input id="im" type="file" accept="image/*"><img id="pv" class="pv hide" alt="">
<label><input type="checkbox" id="pub" checked> Published (visible on the site)</label>
<p class="r"><button class="p" id="save">Save prompt</button><button id="cancel" class="hide">Cancel edit</button></p></section>

<section class="card"><h2>Prompts (<span id="n">0</span>)</h2><div id="list"></div>
<p class="r"><button id="exp">Download backup (JSON)</button></p></section>
</div>

<div id="pane-i" class="hide">
<section class="card"><h2>Messages (<span id="nm">0</span>)</h2><div id="msgs"><p>Loading…</p></div></section>
<section class="card"><h2>Newsletter subscribers (<span id="ns">0</span>)</h2><div id="subs"><p>Loading…</p></div>
<p class="r"><button id="csv">Download emails (CSV)</button></p></section>
</div>

<p class="r"><button id="out">Sign out</button></p>
</div></div>
<script>
var $=function(i){return document.getElementById(i)},tok=sessionStorage.getItem("t")||"",L=[],ed=-1,img="",SUBS=[];
function msg(t,bad){$("msg").textContent=t;$("msg").style.color=bad?"#C23B00":"#0B6B3A"}
function auth(){return{authorization:"Bearer "+tok}}
function api(m,b){return fetch("/api/prompts"+(m==="GET"?"?all=1":""),{method:m,headers:Object.assign({"content-type":"application/json"},auth()),body:b?JSON.stringify(b):undefined})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(d){try{return new Date(d).toLocaleString()}catch(e){return d||""}}
async function load(){
  var r=await api("GET");
  if(r.status===401){sessionStorage.removeItem("t");tok="";$("login").classList.remove("hide");$("app").classList.add("hide");msg("Wrong password.",1);return}
  if(!r.ok){msg(r.status===404?"The API is not deployed yet (error 404). Deploy with Git or `wrangler pages deploy`, not drag-and-drop, so the functions folder is included.":r.status===500?"Server error (500). Check that the PIXPROMPTS KV binding and ADMIN_PASSWORD are set. See CLOUDFLARE_SETUP.md.":"Server error ("+r.status+").",1);return}
  var d=await r.json();L=d.prompts;
  if(!L){try{L=(await(await fetch("/prompts.json")).json())}catch(e){L=[]}msg("Loaded your starter prompts. Click Save on any change to publish them.")}else msg("");
  $("login").classList.add("hide");$("app").classList.remove("hide");draw()}
function draw(){
  $("n").textContent=L.length;
  $("cl").innerHTML=L.map(function(p){return p.category}).filter(function(v,i,a){return a.indexOf(v)===i}).map(function(c){return'<option value="'+esc(c)+'">'}).join("");
  $("list").innerHTML=L.map(function(p,i){return'<div class="it"><div><b>'+esc(p.title)+(p.published===false?'<span class="tg">hidden</span>':"")+'</b><small>'+esc(p.category)+" · "+esc(p.tools)+'</small></div><div><button data-e="'+i+'">Edit</button> <button data-v="'+i+'">'+(p.published===false?"Show":"Hide")+'</button> <button class="d" data-d="'+i+'">Delete</button></div></div>'}).join("")||"<p>No prompts yet.</p>"}
async function persist(ok){
  var r=await api("PUT",{prompts:L});
  if(r.ok){msg(ok||"Saved. Live on the site within a minute.")}else{msg("Save failed ("+r.status+"). Check your password.",1)}return r.ok}
function reset(){ed=-1;img="";["t","c","x"].forEach(function(i){$(i).value=""});$("c1").value="#FFB6C9";$("c2").value="#8EC5FF";$("pub").checked=true;$("im").value="";$("pv").classList.add("hide");$("fh").textContent="Add a prompt";$("cancel").classList.add("hide");Array.prototype.forEach.call($("tools").querySelectorAll("input"),function(c){c.checked=false})}
$("go").onclick=function(){tok=$("pw").value;sessionStorage.setItem("t",tok);load()};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("out").onclick=function(){sessionStorage.removeItem("t");location.reload()};
$("cancel").onclick=reset;
$("save").onclick=async function(){
  var sel=Array.prototype.filter.call($("tools").querySelectorAll("input"),function(c){return c.checked}).map(function(c){return c.value});
  var o={id:ed>-1?L[ed].id:"p"+Date.now(),title:$("t").value.trim(),category:$("c").value.trim(),tools:(sel.length===0||sel.length===4)?"All tools":sel.join(", "),colors:[$("c1").value,$("c2").value],text:$("x").value.trim(),image:img,published:$("pub").checked};
  if(!o.title||!o.category||!o.text){msg("Title, category and prompt text are required.",1);return}
  if(ed>-1)L[ed]=o;else L.unshift(o);
  if(await persist()){reset();draw()}};
$("list").onclick=async function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.e!==undefined){var p=L[+b.dataset.e];ed=+b.dataset.e;$("t").value=p.title;$("c").value=p.category;$("x").value=p.text;$("c1").value=(p.colors||[])[0]||"#FFB6C9";$("c2").value=(p.colors||[])[1]||"#8EC5FF";$("pub").checked=p.published!==false;img=p.image||"";
    Array.prototype.forEach.call($("tools").querySelectorAll("input"),function(c){c.checked=p.tools==="All tools"||p.tools.indexOf(c.value)>-1});
    if(img){$("pv").src=img;$("pv").classList.remove("hide")}$("fh").textContent="Edit prompt";$("cancel").classList.remove("hide");scrollTo(0,0)}
  else if(b.dataset.v!==undefined){var q=L[+b.dataset.v];q.published=q.published===false;await persist();draw()}
  else if(b.dataset.d!==undefined&&confirm("Delete this prompt?")){L.splice(+b.dataset.d,1);await persist("Deleted.");draw()}};
$("im").onchange=function(){
  var f=this.files[0];if(!f)return;var im=new Image();
  im.onload=function(){var s=Math.min(1,900/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    c.toBlob(async function(bl){msg("Uploading image...");
      var r=await fetch("/api/img?ext=jpg",{method:"POST",headers:Object.assign({"content-type":"image/jpeg"},auth()),body:bl});
      if(r.ok){img=(await r.json()).url;$("pv").src=img;$("pv").classList.remove("hide");msg("Image uploaded. Now click Save prompt.")}else msg("Image upload failed ("+r.status+").",1)},"image/jpeg",.82)};
  im.src=URL.createObjectURL(f)};
$("exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,2)],{type:"application/json"}));a.download="pixprompts-backup.json";a.click()};

/* inbox */
function tab(which){var p=which==="p";$("pane-p").classList.toggle("hide",!p);$("pane-i").classList.toggle("hide",p);$("tp").setAttribute("aria-pressed",p);$("ti").setAttribute("aria-pressed",!p);if(!p)loadInbox()}
$("tp").onclick=function(){tab("p")};$("ti").onclick=function(){tab("i")};
async function inbox(type){var r=await fetch("/api/inbox?type="+type,{headers:auth()});if(!r.ok)throw new Error(r.status);return(await r.json()).items}
async function loadInbox(){
  try{
    var m=await inbox("messages");$("nm").textContent=m.length;
    $("msgs").innerHTML=m.map(function(x){return'<div class="msgitem"><b>'+esc(x.name)+'</b> · <a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a><br><small>'+esc(fmt(x.at))+'</small><p>'+esc(x.message)+'</p></div>'}).join("")||"<p>No messages yet.</p>";
    SUBS=await inbox("subscribers");$("ns").textContent=SUBS.length;
    $("subs").innerHTML=SUBS.map(function(x){return'<div class="it"><span>'+esc(x.email)+'</span><small>'+esc(fmt(x.at))+'</small></div>'}).join("")||"<p>No subscribers yet.</p>";
  }catch(e){msg("Could not load the inbox ("+e.message+").",1)}}
$("csv").onclick=function(){var t="email,subscribed_at\n"+SUBS.map(function(s){return'"'+String(s.email).replace(/"/g,'""')+'","'+s.at+'"'}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="pixprompts-subscribers.csv";a.click()};
if(tok)load();
</script></body></html>
